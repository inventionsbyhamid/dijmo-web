[workspace]
resolver = "2"
members = ["crates/core", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "LicenseRef-Proprietary"

[workspace.dependencies]
dijmo-core = { path = "crates/core" }

# Web
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "query", "form", "json", "matched-path", "original-uri", "tracing"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "compression-br", "compression-gzip", "set-header", "trace", "timeout", "limit", "catch-panic"] }
askama = "0.16"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }

# Database (sqlx 0.8: 0.9 needs Rust 1.94)
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "uuid", "json"] }
uuid = { version = "1", features = ["v4"] }

# Crypto
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

# Misc
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "ansi"] }


[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "unwind"
