{% extends "base.html" %}
{% block head %}<meta name="robots" content="noindex">{% endblock %}
{% block body %}
<section class="note-page">
  <div class="clip clip--small" aria-hidden="true">
    <div class="frame frame--bars"><span class="bars__code">{{ code }}</span></div>
  </div>
  <h1 class="note-page__title">{{ heading }}</h1>
  <p class="note-page__body">{{ body }}</p>
  <p class="note-page__next"><a class="text-link" href="{{ base_url }}/">Back to the home page</a></p>
</section>
{% endblock %}
