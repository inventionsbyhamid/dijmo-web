<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{{ title }}{% endblock %}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ css }}">
<script type="module" src="{{ js }}"></script>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Dijmo">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ og_image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Dijmo. Say what you want, and it’s done.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{{ og_image }}">
{% block head %}{% endblock %}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="mark" href="{{ base_url }}/" aria-label="Dijmo home">dijmo</a>
  <button class="sound" type="button" data-sound aria-pressed="false" hidden>
    <svg class="sound__icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path class="sound__cone" d="M3.5 7.5h3l4-3.5v12l-4-3.5h-3z"/><path class="sound__wave sound__wave--1" d="M13 7.6a3.4 3.4 0 0 1 0 4.8"/><path class="sound__wave sound__wave--2" d="M15.2 5.4a6.5 6.5 0 0 1 0 9.2"/><path class="sound__off" d="M13.2 7.8l4.4 4.4m0-4.4l-4.4 4.4"/></svg>
    <span>Sound</span><span class="sound__state" aria-hidden="true" data-sound-state>off</span>
  </button>
</header>
<main id="main">
{% block body %}{% endblock %}
</main>
<footer class="foot">
  <p class="foot__ship">Coming to Mac first, then Windows and Linux.</p>
  <nav class="foot__nav" aria-label="Site">
    <a href="{{ base_url }}/">Home</a>
    <a href="{{ base_url }}/privacy">Privacy</a>
  </nav>
</footer>
</body>
</html>
